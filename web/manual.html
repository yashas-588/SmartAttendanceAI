<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual Attendance — Smart AI Attendance</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { display: flex; height: 100vh; overflow: hidden; }

    /* SIDEBAR (Same as Dashboard) */
    .sidebar { width: var(--sidebar-width); background: rgba(2, 8, 23, 0.95); border-right: 1px solid var(--border-glass); display: flex; flex-direction: column; padding: 24px 0; z-index: 100; }
    .sidebar-logo { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding: 0 24px; margin-bottom: 40px; }
    .sidebar-menu { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
    .menu-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; transition: var(--transition); }
    .menu-item:hover, .menu-item.active { background: rgba(56, 189, 248, 0.1); color: var(--neon-blue); }
    .menu-icon { font-size: 18px; }

    /* MAIN CONTENT */
    .main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); overflow-y: auto; }
    .topbar { height: var(--navbar-height); padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-glass); background: rgba(2, 8, 23, 0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 90; }
    .topbar-title { font-size: 18px; font-weight: 600; }

    .content-container { padding: 32px 40px; max-width: 1000px; margin: 0 auto; width: 100%; }
    
    .glass-panel { background: var(--bg-glass); border: 1px solid var(--border-glass); border-radius: var(--radius); padding: 32px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .panel-title { font-size: 18px; font-weight: 700; }
    
    .filters { display: flex; gap: 16px; margin-bottom: 24px; }
    
    .student-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: var(--transition); }
    .student-row:hover { background: rgba(56,189,248,0.05); }
    .student-info { display: flex; align-items: center; gap: 16px; }
    .s-avatar { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--border-glass); }
    .s-name { font-size: 15px; font-weight: 600; }
    .s-usn { font-size: 12px; color: var(--text-muted); font-family: monospace; }
    
    .status-group { display: flex; gap: 8px; }
    .status-btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: var(--transition); background: transparent; border: 1px solid var(--border-glass); color: var(--text-secondary); }
    .status-btn:hover { background: rgba(255,255,255,0.05); }
    .status-btn.active.present { background: rgba(74, 222, 128, 0.15); color: var(--neon-green); border-color: rgba(74, 222, 128, 0.3); }
    .status-btn.active.absent { background: rgba(239, 68, 68, 0.15); color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }
    .status-btn.active.late { background: rgba(251, 146, 60, 0.15); color: var(--neon-orange); border-color: rgba(251, 146, 60, 0.3); }
    
    .submit-bar { margin-top: 32px; display: flex; justify-content: space-between; align-items: center; padding-top: 24px; border-top: 1px solid var(--border-glass); }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo" style="margin-top:10px;"><img src="logo.png" style="height:38px; display:inline-block; vertical-align:middle; border-radius:6px; box-shadow:0 0 15px rgba(56,189,248,0.4);"></div>
  <nav class="sidebar-menu">
    <a href="dashboard.html" class="menu-item"><span class="menu-icon"><i data-lucide="bar-chart-2"></i></span> Dashboard</a>
    <a href="live.html" class="menu-item"><span class="menu-icon"><i data-lucide="video"></i></span> Live Monitoring</a>
    <a href="students.html" class="menu-item"><span class="menu-icon"><i data-lucide="users"></i></span> Student Management</a>
    <a href="manual.html" class="menu-item active"><span class="menu-icon"><i data-lucide="edit-3"></i></span> Manual Attendance</a>
    <a href="reports.html" class="menu-item"><span class="menu-icon"><i data-lucide="folder"></i></span> Reports & Export</a>
    <a href="settings.html" class="menu-item"><span class="menu-icon"><i data-lucide="settings"></i></span> Settings</a>
  </nav>
</aside>

<!-- MAIN CONTENT -->
<main class="main-content">
  <header class="topbar">
    <h1 class="topbar-title">Manual Override</h1>
  </header>

  <div class="content-container">
    <div class="glass-panel fade-in">
      <div class="panel-header">
        <h2 class="panel-title">Mark Attendance Manually</h2>
        <span class="badge badge-purple" id="date-badge"></span>
      </div>

      <div class="filters">
        <select style="flex:1;"><option>Class: Computer Science (Section A)</option><option>Class: Electronics</option></select>
        <select style="width:200px;"><option>Subject: Data Structures</option><option>Subject: Networks</option></select>
      </div>

      <div style="border: 1px solid var(--border-glass); border-radius: var(--radius); overflow: hidden;" id="student-list">
        <!-- Rows Generated via JS -->
        <div style="padding: 20px; text-align: center; color: var(--text-muted);">Loading students...</div>
      </div>
    </div>
  </div>
</main>

<script>
  const BACKEND = "https://7bea3b025c183d.lhr.life";
  document.getElementById('date-badge').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  async function loadStudents() {
    try {
      const res = await fetch(`${BACKEND}/api/students`);
      const students = await res.json();
      const list = document.getElementById('student-list');
      list.innerHTML = '';
      
      students.forEach(s => {
        list.innerHTML += `
          <div class="student-row">
            <div class="student-info">
              <img src="https://ui-avatars.com/api/?name=${s.name.replace(' ','+')}&background=random&color=fff" class="s-avatar">
              <div>
                <div class="s-name">${s.name}</div>
                <div class="s-usn">${s.usn}</div>
              </div>
            </div>
            <div class="status-group">
              <button class="status-btn" onclick="setStatus(this, '${s.name}', 'Present')">Present</button>
              <button class="status-btn" onclick="setStatus(this, '${s.name}', 'Absent')">Absent</button>
              <button class="status-btn" onclick="setStatus(this, '${s.name}', 'Late')">Late</button>
            </div>
          </div>
        `;
      });
    } catch(e) {
      document.getElementById('student-list').innerHTML = '<div style="padding:20px;text-align:center;">Error loading students.</div>';
    }
  }

  async function setStatus(btn, name, status) {
    const group = btn.parentElement;
    Array.from(group.children).forEach(b => {
      b.classList.remove('active', 'present', 'absent', 'late');
    });
    btn.classList.add('active', status.toLowerCase());
    
    // Save to backend
    try {
      const res = await fetch(`${BACKEND}/api/manual-attendance`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, status })
      });
      const data = await res.json();
      if (!data.success) {
        alert("Failed to mark attendance: " + data.message);
        btn.classList.remove('active', status.toLowerCase());
      }
    } catch(e) {
      alert("Failed to connect to server.");
      btn.classList.remove('active', status.toLowerCase());
    }
  }

  window.onload = loadStudents;
</script>
  <script>lucide.createIcons();</script>
</body>
</html>

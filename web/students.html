<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management — Smart AI Attendance</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { display: flex; height: 100vh; overflow: hidden; }

    /* SIDEBAR (Same as Dashboard) */
    .sidebar { width: var(--sidebar-width); background: rgba(2, 8, 23, 0.95); border-right: 1px solid var(--border-glass); display: flex; flex-direction: column; padding: 24px 0; z-index: 100; }
    .sidebar-logo { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding: 0 24px; margin-bottom: 40px; }
    .sidebar-menu { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
    .menu-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; transition: var(--transition); }
    .menu-item:hover, .menu-item.active { background: rgba(56, 189, 248, 0.1); color: var(--neon-blue); }
    .menu-icon { font-size: 18px; }

    /* MAIN CONTENT */
    .main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); overflow-y: auto; }
    .topbar { height: var(--navbar-height); padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-glass); background: rgba(2, 8, 23, 0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 90; }
    .topbar-title { font-size: 18px; font-weight: 600; }

    .content-container { padding: 32px 40px; }
    
    /* TOOLBAR */
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .search-bar { display: flex; align-items: center; background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass); border-radius: 10px; padding: 0 16px; width: 300px; transition: var(--transition); }
    .search-bar:focus-within { border-color: var(--neon-blue); box-shadow: 0 0 0 3px rgba(56,189,248,0.1); }
    .search-bar input { background: transparent; border: none; padding: 10px 0; outline: none; width: 100%; box-shadow: none; }
    .search-bar input:focus { box-shadow: none; }
    .filter-group { display: flex; gap: 12px; }

    /* STUDENTS GRID */
    .students-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .student-card { background: var(--bg-glass); border: 1px solid var(--border-glass); border-radius: var(--radius); padding: 24px; text-align: center; transition: var(--transition); position: relative; overflow: hidden; }
    .student-card:hover { border-color: var(--border-neon); transform: translateY(-4px); box-shadow: var(--shadow-neon); }
    
    .student-avatar { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--border-glass); margin: 0 auto 16px; object-fit: cover; }
    .student-card:hover .student-avatar { border-color: var(--neon-blue); }
    
    .student-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .student-usn { font-size: 13px; color: var(--text-muted); font-family: monospace; margin-bottom: 12px; }
    .student-dept { display: inline-block; padding: 4px 10px; background: rgba(167,139,250,0.1); color: var(--neon-purple); border-radius: 6px; font-size: 12px; font-weight: 500; margin-bottom: 16px; }
    
    .student-stats { display: flex; justify-content: space-around; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 16px; margin-bottom: 16px; }
    .s-stat { text-align: center; }
    .s-stat-val { font-size: 16px; font-weight: 700; color: var(--neon-blue); }
    .s-stat-lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    
    .card-actions { display: flex; gap: 8px; justify-content: center; }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo" style="margin-top:10px;"><img src="logo.png" style="height:38px; display:inline-block; vertical-align:middle; border-radius:6px; box-shadow:0 0 15px rgba(56,189,248,0.4);"></div>
  <nav class="sidebar-menu">
    <a href="dashboard.html" class="menu-item"><span class="menu-icon"><i data-lucide="bar-chart-2"></i></span> Dashboard</a>
    <a href="live.html" class="menu-item"><span class="menu-icon"><i data-lucide="video"></i></span> Live Monitoring</a>
    <a href="students.html" class="menu-item active"><span class="menu-icon"><i data-lucide="users"></i></span> Student Management</a>
    <a href="manual.html" class="menu-item"><span class="menu-icon"><i data-lucide="edit-3"></i></span> Manual Attendance</a>
    <a href="reports.html" class="menu-item"><span class="menu-icon"><i data-lucide="folder"></i></span> Reports & Export</a>
    <a href="settings.html" class="menu-item"><span class="menu-icon"><i data-lucide="settings"></i></span> Settings</a>
  </nav>
</aside>

<!-- MAIN CONTENT -->
<main class="main-content">
  <header class="topbar">
    <h1 class="topbar-title">Student Directory</h1>
    <button class="btn-primary" onclick="openAddModal()"><i data-lucide="plus"></i> Add New Student</button>
  </header>

  <div class="content-container">
    <div class="toolbar">
      <div class="search-bar">
        <span><i data-lucide="search"></i></span>
        <input type="text" placeholder="Search by name or USN..." style="margin-left:10px;">
      </div>
      <div class="filter-group">
        <select style="width: 150px;">
          <option>All Departments</option>
          <option>Computer Science</option>
          <option>Electronics</option>
        </select>
        <select style="width: 150px;">
          <option>Sort by Name</option>
          <option>Sort by Attendance</option>
        </select>
      </div>
    </div>

    <div class="students-grid" id="students-grid">
      <!-- Generated via JS -->
    </div>
  </div>
</main>

<!-- ADD STUDENT MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Register New Student</h3>
      <button class="modal-close" onclick="document.getElementById('addModal').classList.remove('active')">✕</button>
    </div>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="add-name" placeholder="e.g. John Doe">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>USN / ID Number</label>
        <input type="text" id="add-usn" placeholder="e.g. 1RV21CS001">
      </div>
      <div class="form-group">
        <label>Department</label>
        <select id="add-dept"><option>Computer Science</option><option>Electronics</option></select>
      </div>
    </div>
    <div class="form-group">
      <label>Face Data (Capture 5 images for AI training)</label>
      <div style="border: 2px solid var(--border-neon); border-radius: 12px; overflow: hidden; background: #000; position: relative; height: 240px; margin-bottom: 12px;">
        <video id="reg-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        <canvas id="reg-canvas" style="display:none;"></canvas>
        <div style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; color: var(--neon-blue);" id="capture-count">0 / 5 Captured</div>
      </div>
      <button class="btn-secondary" style="width: 100%; justify-content: center; padding: 12px;" onclick="captureRegFrame()" id="capture-btn"><i data-lucide="camera"></i> Capture Face</button>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
      <button class="btn-secondary" onclick="closeAddModal()">Cancel</button>
      <button class="btn-primary" onclick="submitNewStudent()" id="submit-btn" disabled>Register & Train AI</button>
    </div>
  </div>
</div>

<script>
  const BACKEND = "https://7bea3b025c183d.lhr.life";

  async function loadStudents() {
    try {
      const res = await fetch(`${BACKEND}/api/students`);
      const students = await res.json();
      const grid = document.getElementById('students-grid');
      grid.innerHTML = '';
      
      students.forEach(s => {
        grid.innerHTML += `
          <div class="student-card fade-in">
            <img src="https://ui-avatars.com/api/?name=${s.name.replace(' ','+')}&background=random&color=fff" class="student-avatar" alt="${s.name}">
            <div class="student-name">${s.name}</div>
            <div class="student-usn">${s.usn}</div>
            <div class="student-dept">${s.dept}</div>
            
            <div class="student-stats">
              <div class="s-stat">
                <div class="s-stat-val">${s.att}</div>
                <div class="s-stat-lbl">Attendance</div>
              </div>
              <div class="s-stat">
                <div class="s-stat-val" style="color:var(--text-primary); font-size:12px; padding-top:4px;">${s.last}</div>
                <div class="s-stat-lbl">Last Seen</div>
              </div>
            </div>

            <div class="card-actions">
              <button class="btn-secondary" style="padding: 6px 12px; font-size:12px;" onclick="editStudent('${s.name}')"><i data-lucide="edit-3"></i> Edit</button>
              <button class="btn-danger" style="padding: 6px 12px; font-size:12px;" onclick="deleteStudent('${s.name}')"><i data-lucide="trash-2"></i> Delete</button>
            </div>
          </div>
        `;
      });
      lucide.createIcons();
    } catch(e) {
      console.log(e);
      document.getElementById('students-grid').innerHTML = '<p>Error loading students. Make sure backend is running.</p>';
    }
  }

  async function deleteStudent(name) {
    if (!confirm(`Are you sure you want to completely delete ${name}? This will remove their AI face data.`)) return;
    
    try {
      const res = await fetch(`${BACKEND}/api/students/${name}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) {
        alert(data.message);
        loadStudents();
      } else {
        alert("Failed: " + data.message);
      }
    } catch(e) {
      alert("Error connecting to backend.");
    }
  }

  async function editStudent(name) {
    const newName = prompt(`Enter new name for ${name}:`, name);
    if (!newName || newName === name) return;
    
    try {
      const res = await fetch(`${BACKEND}/api/students/${name}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ new_name: newName })
      });
      const data = await res.json();
      if (data.success) {
        alert(data.message);
        loadStudents();
      } else {
        alert("Failed: " + data.message);
      }
    } catch(e) {
      alert("Error connecting to backend.");
    }
  }

  let regStream = null;
  let capturedFrames = [];

  async function openAddModal() {
    document.getElementById('addModal').classList.add('active');
    capturedFrames = [];
    document.getElementById('capture-count').textContent = '0 / 5 Captured';
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('capture-btn').disabled = false;
    
    try {
      regStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      document.getElementById('reg-video').srcObject = regStream;
    } catch(e) {
      alert("Camera access denied! Cannot capture faces.");
    }
  }

  function closeAddModal() {
    document.getElementById('addModal').classList.remove('active');
    if (regStream) {
      regStream.getTracks().forEach(t => t.stop());
      regStream = null;
    }
  }

  function captureRegFrame() {
    if (capturedFrames.length >= 5) return;
    
    const video = document.getElementById('reg-video');
    const canvas = document.getElementById('reg-canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    capturedFrames.push(canvas.toDataURL('image/jpeg', 0.8));
    document.getElementById('capture-count').textContent = `${capturedFrames.length} / 5 Captured`;
    
    if (capturedFrames.length >= 5) {
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('capture-btn').disabled = true;
      alert("5 frames captured successfully! You can now Register & Train AI.");
    }
  }

  async function submitNewStudent() {
    const name = document.getElementById('add-name').value;
    const btn = document.getElementById('submit-btn');
    
    if (!name || capturedFrames.length < 5) {
      alert("Name is required and you must capture 5 images.");
      return;
    }
    
    btn.textContent = "Processing...";
    btn.disabled = true;
    
    try {
      const res = await fetch(`${BACKEND}/api/students`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, images: capturedFrames })
      });
      const data = await res.json();
      
      if (data.success) {
        alert(data.message);
        closeAddModal();
        document.getElementById('add-name').value = '';
        loadStudents();
      } else {
        alert("Error: " + data.message);
      }
    } catch(e) {
      alert("Failed to connect to backend.");
    }
    
    btn.textContent = "Register & Train AI";
    btn.disabled = false;
  }

  window.onload = loadStudents;
</script>
  <script>lucide.createIcons();</script>
</body>
</html>

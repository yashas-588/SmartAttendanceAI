<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — Smart AI Attendance</title>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; background: var(--gradient-bg); padding:20px; }
    .pw-wrap { width:100%; max-width:440px; }
    .pw-card { background:var(--bg-glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border-glass); border-radius:24px; padding:40px 36px; box-shadow:var(--shadow-card); }
    .pw-logo { text-align:center; margin-bottom:28px; }
    .pw-logo img { height:56px; border-radius:12px; box-shadow:0 0 20px rgba(56,189,248,0.4); }
    .pw-title { font-family:'Orbitron',sans-serif; font-size:22px; font-weight:700; text-align:center; background:var(--gradient-primary); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:6px; }
    .pw-sub { text-align:center; font-size:13px; color:var(--text-secondary); margin-bottom:32px; }

    .form-group { margin-bottom:20px; }
    .form-group label { display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }
    .input-wrap { position:relative; }
    .input-wrap i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted); width:16px; height:16px; }
    .input-wrap input { padding-left:44px; }
    
    .btn-primary { width:100%; padding:14px; font-size:15px; font-weight:700; border-radius:12px; margin-top:8px; display:flex; align-items:center; justify-content:center; gap:8px; }
    
    .pw-requirements { margin: 16px 0; padding: 12px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-glass); border-radius: 10px; font-size: 12px; }
    .req-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--text-muted); transition: var(--transition); }
    .req-item.valid { color: var(--neon-green); }
    .req-item.valid i { stroke: var(--neon-green); }
    .req-item i { width: 14px; height: 14px; }
  </style>
</head>
<body>

<div class="pw-wrap fade-in">
  <div class="pw-card">
    <div class="pw-logo">
      <img src="../logo.png" alt="Smart AI Attendance">
    </div>
    <h2 class="pw-title">Change Password</h2>
    <p class="pw-sub">Institution policy requires you to update your temporary password before accessing your student portal.</p>
    
    <div class="form-group">
      <label>New Password</label>
      <div class="input-wrap">
        <i data-lucide="lock"></i>
        <input type="password" id="new-password" placeholder="Min. 6 characters" oninput="validateForm()">
      </div>
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <div class="input-wrap">
        <i data-lucide="shield-check"></i>
        <input type="password" id="confirm-password" placeholder="Re-enter new password" oninput="validateForm()">
      </div>
    </div>

    <div class="pw-requirements">
      <div class="req-item" id="req-len">
        <i data-lucide="circle"></i> At least 6 characters long
      </div>
      <div class="req-item" id="req-match">
        <i data-lucide="circle"></i> Passwords must match
      </div>
    </div>

    <button class="btn-primary" id="change-btn" onclick="submitPasswordChange()" disabled>
      <i data-lucide="key"></i> Update &amp; Access Dashboard
    </button>
    <div style="text-align: center; margin-top: 20px;">
      <a href="#" onclick="signOut(); return false;" style="color: var(--text-secondary); font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition);" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-secondary)'">
        <i data-lucide="log-out" style="width: 14px; height: 14px;"></i> Sign Out / Cancel
      </a>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../firebase-config.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
  requireAuth('student', '../');

  // Render Lucide icons as soon as DOM is ready (authReady may fire later)
  document.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
  });
  document.addEventListener('authReady', () => {
    lucide.createIcons();
  });

  function validateForm() {
    const pw = document.getElementById('new-password').value;
    const confirmPw = document.getElementById('confirm-password').value;
    
    const isLenValid = pw.length >= 6;
    const isMatchValid = pw === confirmPw && pw.length > 0;
    
    updateRequirementUI('req-len', isLenValid);
    updateRequirementUI('req-match', isMatchValid);
    
    const changeBtn = document.getElementById('change-btn');
    changeBtn.disabled = !(isLenValid && isMatchValid);
  }

  function updateRequirementUI(elementId, isValid) {
    const el = document.getElementById(elementId);
    if (!el) return;
    const icon = el.querySelector('i');
    if (isValid) {
      el.classList.add('valid');
      if (icon) icon.setAttribute('data-lucide', 'check-circle-2');
    } else {
      el.classList.remove('valid');
      if (icon) icon.setAttribute('data-lucide', 'circle');
    }
    lucide.createIcons();
  }

  async function submitPasswordChange() {
    const pw = document.getElementById('new-password').value;
    const changeBtn = document.getElementById('change-btn');
    
    changeBtn.disabled = true;
    changeBtn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:8px;"></div> Saving...';
    
    try {
      const user = auth.currentUser;
      if (!user) throw new Error("No authenticated user session found.");
      
      // 1. Update Firebase Auth Password
      await user.updatePassword(pw);
      
      // 2. Set mustChangePassword to false in Firestore users collection
      await db.collection('users').doc(user.uid).update({
        mustChangePassword: false,
        passwordLastChangedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      
      showToast('Password updated successfully! Welcome to your dashboard.', 'success');
      
      // Redirect to mark page after a short delay
      setTimeout(() => {
        window.location.replace('mark.html');
      }, 1500);
      
    } catch(e) {
      showToast(`Error updating password: ${e.message}`, 'error');
      changeBtn.disabled = false;
      changeBtn.innerHTML = '<i data-lucide="key"></i> Update &amp; Access Dashboard';
      lucide.createIcons();
    }
  }
</script>

</body>
</html>

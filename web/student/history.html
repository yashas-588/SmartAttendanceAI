<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Attendance — Student Portal</title>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background:var(--gradient-bg); min-height:100vh; }
    .s-nav { height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; background:rgba(2,8,23,0.9); backdrop-filter:blur(20px); border-bottom:1px solid var(--border-glass); position:sticky; top:0; z-index:100; }
    .s-nav-logo { font-family:'Inter',sans-serif; font-size:14px; font-weight:800; background:var(--gradient-primary); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .main { max-width:700px; margin:0 auto; padding:20px; }
    .stat-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(100px, 1fr)); gap:12px; margin-bottom:24px; }
    .stat-box { background:var(--bg-glass); border:1px solid var(--border-glass); border-radius:14px; padding:16px; text-align:center; }
    .stat-num { font-family:'Inter',sans-serif; font-size:24px; font-weight:700; }
    .stat-lbl { font-size:11px; color:var(--text-muted); margin-top:4px; }
    .streak-card { background:linear-gradient(135deg,rgba(56,189,248,0.1),rgba(167,139,250,0.1)); border:1px solid var(--border-neon); border-radius:16px; padding:20px; margin-bottom:24px; display:flex; align-items:center; gap:16px; }
    .streak-icon { font-size:40px; }
    .streak-num { font-family:'Inter',sans-serif; font-size:32px; font-weight:700; background:var(--gradient-primary); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .filter-row { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .filter-btn { padding:7px 16px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid var(--border-glass); background:transparent; color:var(--text-muted); cursor:pointer; transition:var(--transition); }
    .filter-btn.active { background:rgba(56,189,248,0.15); border-color:rgba(56,189,248,0.4); color:var(--neon-blue); }
    .rec-list { display:flex; flex-direction:column; gap:8px; }
    .rec-item { background:var(--bg-glass); border:1px solid var(--border-glass); border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:14px; transition:var(--transition); }
    .rec-item:hover { border-color:var(--border-neon); }
    .rec-date { font-family:'Inter',sans-serif; font-size:11px; color:var(--text-muted); }
    .rec-time { font-size:13px; font-weight:600; }
    .rec-method { font-size:11px; color:var(--text-muted); margin-top:2px; }
    .rec-badge { margin-left:auto; flex-shrink:0; }
    .calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:24px; }
    .cal-day { aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; }
    .cal-day.present { background:rgba(74,222,128,0.2); color:var(--neon-green); border:1px solid rgba(74,222,128,0.3); }
    .cal-day.absent  { background:rgba(239,68,68,0.1); color:#f87171; border:1px solid rgba(239,68,68,0.2); }
    .cal-day.empty   { background:transparent; }
    .cal-day.today   { border:2px solid var(--neon-blue) !important; }
    .bottom-nav { display:none; }
    @media(max-width:600px) {
      .bottom-nav { display:flex; position:fixed; bottom:0; left:0; right:0; background:rgba(2,8,23,0.95); border-top:1px solid var(--border-glass); padding:8px 0 max(8px,env(safe-area-inset-bottom)); z-index:100; }
      .bn-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--text-muted); text-decoration:none; padding:4px; }
      .bn-item.active { color:var(--neon-blue); }
      .main { padding-bottom:80px; }
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="../js/auth-guard.js?v=2.4"></script>
</head>
<body>
<nav class="s-nav">
  <div class="s-nav-logo"><img src="../logo.png" alt="Logo" style="height:28px;border-radius:4px;vertical-align:middle;margin-right:6px;"> My Attendance</div>
  <div style="display:flex;gap:10px;">
    <a href="mark.html" class="btn-secondary" style="padding:6px 14px;font-size:12px;"><i data-lucide="scan-face"></i> Mark</a>
    <button class="btn-danger" style="padding:6px 12px;font-size:12px;" onclick="signOut()"><i data-lucide="log-out"></i></button>
  </div>
</nav>

<div class="main">
  <h1 style="font-size:20px;font-weight:700;margin-bottom:4px;" id="student-name">My Attendance</h1>
  <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;" id="student-id"></p>

  <!-- STATS -->
  <div class="stat-row">
    <div class="stat-box">
      <div class="stat-num" style="color:var(--neon-green);" id="st-present">0</div>
      <div class="stat-lbl">Days Present</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" style="color:#f87171;" id="st-absent">0</div>
      <div class="stat-lbl">Days Absent</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" style="color:var(--neon-blue);" id="st-pct">--%</div>
      <div class="stat-lbl">Attendance %</div>
    </div>
  </div>

  <!-- STREAK -->
  <div class="streak-card">
    <div class="streak-icon"><i data-lucide="flame" style="width:24px;height:24px;color:var(--neon-orange);"></i></div>
    <div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">CURRENT STREAK</div>
      <div class="streak-num" id="streak-num">0</div>
      <div style="font-size:12px;color:var(--text-muted);">consecutive days</div>
    </div>
    <div style="margin-left:auto;text-align:right;">
      <div style="font-size:11px;color:var(--text-muted);">Best</div>
      <div style="font-size:18px;font-weight:700;color:var(--neon-purple);" id="best-streak">0</div>
    </div>
  </div>

  <!-- MINI CALENDAR -->
  <h3 style="font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text-secondary);">LAST 28 DAYS</h3>
  <div class="calendar-grid" id="cal-grid"></div>

  <!-- HISTORY LIST -->
  <div class="filter-row">
    <button class="filter-btn active" onclick="filterRecs('all', this)">All</button>
    <button class="filter-btn" onclick="filterRecs('Present', this)">Present</button>
    <button class="filter-btn" onclick="filterRecs('Absent', this)">Absent</button>
    <button class="filter-btn" onclick="filterRecs('Late', this)">Late</button>
  </div>
  <div class="rec-list" id="rec-list">
    <div style="text-align:center;padding:40px;color:var(--text-muted);">Loading...</div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="mark.html" class="bn-item"><i data-lucide="scan-face"></i>Mark</a>
  <a href="history.html" class="bn-item active"><i data-lucide="clock"></i>History</a>
  <a href="#" class="bn-item" onclick="signOut()"><i data-lucide="log-out"></i>Out</a>
</nav>

<script>
requireAuth('student', '../');
let allRecords = [];

document.addEventListener('authReady', async e => {
  const u = e.detail;
  document.getElementById('student-name').textContent = u.name || 'My Attendance';
  document.getElementById('student-id').textContent = u.email;

  // Self-healing activation status trigger & link external UID
  try {
    let actSnap = await db.collection('students').where('uid', '==', u.uid).limit(1).get();
    if (actSnap.empty && u.email) {
      const emailSnap = await db.collection('students').where('email', '==', u.email.toLowerCase()).limit(1).get();
      if (!emailSnap.empty) {
        const doc = emailSnap.docs[0];
        const data = doc.data();
        const hasFace = !!data.descriptors;
        const targetStatus = hasFace ? 'Active' : 'Face Setup Needed';
        await doc.ref.update({
          uid: u.uid,
          accountStatus: targetStatus
        });
        console.log(`Student record linked to UID: ${u.uid} with status: ${targetStatus}`);
        actSnap = await db.collection('students').where('uid', '==', u.uid).limit(1).get();
      }
    }
    actSnap.forEach(async doc => {
      const data = doc.data();
      const hasFace = !!data.descriptors;
      const expectedStatus = hasFace ? 'Active' : 'Face Setup Needed';
      if (data.accountStatus !== expectedStatus) {
        await doc.ref.update({ accountStatus: expectedStatus });
        console.log(`Student accountStatus self-healed to ${expectedStatus}.`);
      }
    });
  } catch(err) { console.warn('Status sync notice:', err.message); }

  await loadRecords(u.uid);
});

async function loadRecords(uid) {
  const snap = await db.collection('attendance')
    .where('student_uid', '==', uid)
    .get();

  allRecords = [];
  snap.forEach(d => allRecords.push(d.data()));
  // Sort newest first (client-side, avoids Firestore composite index requirement)
  allRecords.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  renderStats();
  renderCalendar();
  renderList(allRecords);
}

function renderStats() {
  const present = allRecords.filter(r => r.status === 'Present').length;
  const total   = allRecords.length;
  document.getElementById('st-present').textContent = present;
  document.getElementById('st-absent').textContent  = allRecords.filter(r => r.status === 'Absent').length;
  document.getElementById('st-pct').textContent     = total ? Math.round((present/total)*100) + '%' : '--%';
  // Streak
  const dates = allRecords.filter(r => r.status === 'Present').map(r => r.date).sort().reverse();
  let streak = 0, best = 0, cur = 0, prev = null;
  for (const d of dates) {
    if (!prev) { cur = 1; }
    else {
      const diff = (new Date(prev) - new Date(d)) / 86400000;
      cur = diff === 1 ? cur + 1 : 1;
    }
    if (streak === 0) streak = cur;
    best = Math.max(best, cur);
    prev = d;
  }
  document.getElementById('streak-num').textContent = streak;
  document.getElementById('best-streak').textContent = best;
}

function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  const today = new Date();
  const presentSet = new Set(allRecords.filter(r => r.status === 'Present').map(r => r.date));
  const html = [];
  for (let i = 27; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const ds = d.toISOString().split('T')[0];
    const isToday = ds === today.toISOString().split('T')[0];
    const cls = presentSet.has(ds) ? 'present' : (d <= today && i > 0 ? 'absent' : 'empty');
    html.push(`<div class="cal-day ${cls} ${isToday?'today':''}" title="${ds}">${d.getDate()}</div>`);
  }
  grid.innerHTML = html.join('');
}

function renderList(records) {
  const list = document.getElementById('rec-list');
  if (records.length === 0) { list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">No records found.</div>'; return; }
  const colors = { Present: 'badge-green', Absent: 'badge-red', Late: 'badge-orange' };
  list.innerHTML = records.map(r => `
    <div class="rec-item">
      <div style="width:40px;height:40px;border-radius:10px;background:rgba(56,189,248,0.1);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">
        ${r.status==='Present'?'<i data-lucide="check-circle" style="width:14px;height:14px;color:var(--neon-green);"></i>':r.status==='Absent'?'<i data-lucide="x-circle" style="width:14px;height:14px;color:#f87171;"></i>':'<i data-lucide="clock" style="width:14px;height:14px;color:var(--neon-orange);"></i>'}
      </div>
      <div>
        <div class="rec-time">${r.date}</div>
        <div class="rec-method">${r.time || '--'} · ${r.method || 'Face Recognition'} ${r.confidence ? '· '+Math.round(r.confidence*100)+'%' : ''}</div>
      </div>
      <div class="rec-badge"><span class="badge ${colors[r.status]||'badge-blue'}">${r.status}</span></div>
    </div>`).join('');
  lucide.createIcons();
}

function filterRecs(status, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList(status === 'all' ? allRecords : allRecords.filter(r => r.status === status));
}

lucide.createIcons();
</script>
</body>
</html>

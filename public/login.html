<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
      text-align: center;
      margin-top: 120px;
      font-family: Arial;
    }

    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 15px;
      display: inline-block;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      border-radius: 10px;
      border: none;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Login</h1>

  <button onclick="loginGoogle()">Google Login</button>
  <br>
  <button onclick="loginGuest()">Continue without login</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCDBG4wECmxqmrcX5dkhBAA_r6bFTg4KCE",
  authDomain: "smart-attendance-ai-7139f.firebaseapp.com",
  projectId: "smart-attendance-ai-7139f"
};

firebase.initializeApp(firebaseConfig);

// ✅ FIX: Popup login (no redirect loop)
function loginGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider)
    .then(() => {
      window.location.href = "index.html";
    })
    .catch(err => console.log(err));
}

// ✅ Guest login
function loginGuest() {
  firebase.auth().signInAnonymously()
    .then(() => {
      window.location.href = "index.html";
    })
    .catch(err => console.log(err));
}

// ❌ IMPORTANT: REMOVE auto redirect from here
</script>

</body>
</html>

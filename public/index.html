<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><!DOCTYPE html>
<html>
<head>
  <title>Smart Attendance</title>

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    table {
      margin: 30px auto;
      border-collapse: collapse;
      width: 85%;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #333;
    }

    img {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      object-fit: cover;
    }

    button {
      padding: 10px 20px;
      background: red;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>🔥 Smart Attendance</h1>

<button onclick="logout()">Logout</button>

<table>
  <thead>
    <tr>
      <th>Face</th>
      <th>Name</th>
      <th>Subject</th>
      <th>Time</th>
    </tr>
  </thead>
  <tbody id="table-body"></tbody>
</table>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCDBG4wECmxqmrcX5dkhBAA_r6bFTg4KCE",
  authDomain: "smart-attendance-ai-7139f.firebaseapp.com",
  projectId: "smart-attendance-ai-7139f"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

// 🔐 AUTH CHECK
firebase.auth().onAuthStateChanged((user) => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    loadData();
  }
});

// 📦 LOAD DATA
function loadData() {
  const table = document.getElementById("table-body");

  db.collection("attendance")
    .orderBy("time", "desc")
    .onSnapshot((snapshot) => {

      table.innerHTML = "";

      if (snapshot.empty) {
        table.innerHTML = "<tr><td colspan='4'>No attendance yet 😶</td></tr>";
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();

        console.log("DATA:", data);

        const img = data.image || "https://via.placeholder.com/80";
        const name = data.name || "Unknown";
        const subject = data.subject || "N/A";
        const time = data.time || "--";

        const row = `
          <tr>
            <td>
              <img src="${img}"
                   onerror="this.src='https://via.placeholder.com/80'"/>
            </td>
            <td>${name}</td>
            <td>${subject}</td>
            <td>${time}</td>
          </tr>
        `;

        table.innerHTML += row;
      });
    });
}

// 🚪 LOGOUT
function logout() {
  firebase.auth().signOut().then(() => {
    window.location.href = "login.html";
  });
}
</script>

</body>
</html>
